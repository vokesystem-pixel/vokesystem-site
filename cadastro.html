<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - VokeSystem</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-body">

    <a href="index.html" class="auth-logo">
        <img src="assets/logo.png" alt="Logo VokeSystem">
    </a>

    <main class="auth-container">

        <section class="auth-card reveal">

            <span class="section-tag">CADASTRO</span>

            <h1>Crie sua conta</h1>

            <p>
                Faça parte da plataforma VokeSystem e conecte-se à sua comunidade coral.
            </p>

            <form action="#" method="post" class="auth-form">

                <div class="input-group">
                    <label for="nome">Nome completo</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        required>
                </div>

                <div class="duas-colunas">

                    <div class="input-group">
                        <label for="cpf">CPF</label>
                        <input
                            type="text"
                            id="cpf"
                            name="cpf"
                            placeholder="000.000.000-00"
                            required>
                    </div>

                    <div class="input-group">
                        <label for="telefone">Telefone</label>
                        <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            placeholder="(00) 00000-0000"
                            required>
                    </div>

                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required>
                </div>

                <div class="input-group">
                    <label for="endereco">Endereço</label>
                    <input
                        type="text"
                        id="endereco"
                        name="endereco"
                        placeholder="Rua, número, bairro, cidade"
                        required>
                </div>

                <div class="input-group">
                    <label for="tipoUsuario">Tipo de Usuário</label>

                    <select
                        id="tipoUsuario"
                        name="tipoUsuario"
                        required>

                        <option value="" selected disabled>
                            Selecione uma opção
                        </option>

                        <option value="regente">
                            Regente de Coral
                        </option>

                        <option value="professor">
                            Professor de Canto
                        </option>

                        <option value="coralista">
                            Coralista
                        </option>

                    </select>

                </div>

                <div class="duas-colunas">

                    <div class="input-group">
                        <label for="senha">Senha</label>
                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Crie uma senha"
                            required>
                    </div>

                    <div class="input-group">
                        <label for="confirmarSenha">
                            Confirmar senha
                        </label>
                        <input
                            type="password"
                            id="confirmarSenha"
                            name="confirmarSenha"
                            placeholder="Repita a senha"
                            required>
                    </div>

                </div>

                <button type="submit" class="btn btn-fill auth-btn">
                    Criar Conta
                </button>

            </form>

            <div class="auth-footer">

                <p>
                    Já possui uma conta?
                    <a href="login.html">Entrar</a>
                </p>

            </div>

            <div class="auth-info">
                <small>
                    <strong>Administrador:</strong> contas administrativas
                    são criadas e gerenciadas internamente pelo sistema.
                </small>
            </div>

        </section>

    </main>

    <script>

        const card = document.querySelector(".reveal");

        const observer = new IntersectionObserver((entries)=>{
            entries.forEach(entry=>{
                if(entry.isIntersecting){
                    entry.target.classList.add("active");
                }
            });
        },{threshold:0.15});

        observer.observe(card);

    </script>

</body>
</html>
