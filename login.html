<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - VokeSystem</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

    <a href="index.html" class="auth-logo">
        <img src="logo.png" alt="VokeSystem">
    </a>

    <main class="auth-container">

        <section class="auth-card reveal">

            <h1>Bem-vindo de volta!</h1>

            <p>
                Entre na sua conta para acessar a plataforma VokeSystem.
            </p>

            <form action="#" method="post" class="auth-form">

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required>
                </div>

                <button type="submit" class="btn btn-fill auth-btn">
                    Entrar
                </button>

            </form>

            <div class="auth-footer">
                <p>
                    Ainda não possui uma conta?
                    <a href="cadastro.html">Cadastre-se</a>
                </p>
            </div>

        </section>

    </main>

    <script>
        const card = document.querySelector(".reveal");

        const observer = new IntersectionObserver((entries)=>{
            entries.forEach(entry=>{
                if(entry.isIntersecting){
                    entry.target.classList.add("active");
                }
            });
        });

        observer.observe(card);
    </script>

</body>
</html>
